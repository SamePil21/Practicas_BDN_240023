<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diccionario de datos · Data Atlas</title><link rel="stylesheet" href="estilos.css"><script defer src="datos_bd.js"></script><script defer src="app.js"></script></head><body data-page="dict"><main class="wrap"><header class="hero"><div class="eyebrow">DOCUMENTACIÓN TÉCNICA · db_test</div><h1>Diccionario de <span class="accent">datos</span></h1><p>25 tablas · tipos y restricciones extraídos del dump. Busca, filtra, imprime o abre una entidad en el diagrama EER.</p></header><div class="toolbar"><input id="q" class="filter" type="search" placeholder="Buscar tabla, columna, tipo…"><select id="mod" class="filter"><option value="">Todos los módulos</option><option>Usuarios y Direcciones</option><option>Catálogo y Productos</option><option>Carrito y Pedidos</option><option>Pagos y Transacciones</option><option>Cancelaciones y Devoluciones</option><option>Auditoría y Logs</option><option>Envíos</option></select><select id="pre" class="filter"><option value="">Todos los tipos</option><option value="tb">tb_ · Entidades</option><option value="tbc">tbc_ · Catálogos</option><option value="tbd">tbd_ · Relaciones</option></select><select id="empty" class="filter"><option value="">Con y sin datos</option><option value="with">Con registros</option><option value="zero">Vacías</option></select><button id="print">Imprimir / exportar PDF</button></div><div class="toolbar"><input id="jumpname" list="tableslist" placeholder="Nombre exacto de tabla para abrir en EER"><datalist id="tableslist"></datalist><button id="jump">Abrir tabla en EER ↗</button></div><div id="tables"></div><section class="section"><div class="eyebrow">OBJETOS DE BASE DE DATOS</div><h2>Vistas, rutinas y auditoría</h2><div class="objtabs"><button class="objtab active" data-show="all">Todos</button><button class="objtab" data-show="views">Vistas</button><button class="objtab" data-show="functions">Funciones</button><button class="objtab" data-show="procedures">Procedimientos</button><button class="objtab" data-show="events">Eventos</button><button class="objtab" data-show="triggers">Triggers</button></div></section><div id="objects"></div></main><footer class="footer">DATA ATLAS · Diccionario técnico extraído del respaldo</footer><script>document.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{const d=document.querySelector('#tableslist');if(window.DB_DATA)d.innerHTML=Object.keys(DB_DATA.tables).map(n=>`<option value="${n}">`).join('');document.querySelectorAll('.objtab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.objtab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.objsection').forEach(s=>s.hidden=b.dataset.show!=='all'&&s.dataset.kind!==b.dataset.show)})},80)})</script></body></html>
